<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#0f172a" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Recomp Tracker" />
  <link rel="manifest" href="./manifest.json" />
  <link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png" />
  <link rel="apple-touch-icon" href="./icon-192.png" />
  <title>3-Day Body Recomp Tracker</title>
  <style>
    :root {
      --bg: #0f172a;
      --surface: #1e293b;
      --surface-2: #0b1220;
      --border: #334155;
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --accent-dark: #0284c7;
      --success: #22c55e;
      --warn: #f59e0b;
      --danger: #ef4444;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: var(--bg); color: var(--text); max-width: 640px; margin: 0 auto; padding-bottom: 112px; min-height: 100vh; }

    /* Top Header */
    .topbar { position: sticky; top: 0; z-index: 40; background: rgba(15, 23, 42, 0.95); backdrop-filter: blur(8px); border-bottom: 1px solid var(--border); padding: 12px 14px; display: flex; align-items: center; justify-content: space-between; gap: 10px; }
    .topbar-left { display: flex; align-items: center; gap: 10px; }
    .menu-btn { background: var(--surface); border: 1px solid var(--border); color: var(--text); width: 40px; height: 40px; border-radius: 10px; font-size: 1.2rem; display: flex; align-items: center; justify-content: center; cursor: pointer; }
    .brand h1 { font-size: 1.05rem; font-weight: 700; line-height: 1.2; }
    .brand small { font-size: 0.72rem; color: var(--muted); }
    .badge { background: var(--accent-dark); color: #fff; padding: 5px 10px; border-radius: 999px; font-size: 0.75rem; font-weight: 700; white-space: nowrap; }

    /* Install Banner */
    .install-banner { display: none; margin: 12px 14px 0; padding: 10px 12px; background: rgba(56, 189, 248, 0.12); border: 1px solid var(--accent); border-radius: 12px; align-items: center; justify-content: space-between; gap: 10px; }
    .install-banner.show { display: flex; }
    .install-banner span { font-size: 0.82rem; color: var(--text); }
    .install-btn { background: var(--accent); color: #0f172a; border: none; padding: 7px 12px; border-radius: 8px; font-weight: 700; font-size: 0.78rem; cursor: pointer; white-space: nowrap; }

    /* Main Container */
    main { padding: 14px; }

    /* Day Tabs */
    .day-tabs { display: flex; gap: 8px; margin-bottom: 14px; }
    .day-tab { flex: 1; background: var(--surface); border: 1px solid var(--border); color: var(--muted); padding: 10px 6px; border-radius: 10px; font-weight: 700; font-size: 0.82rem; text-align: center; cursor: pointer; }
    .day-tab.active { background: var(--accent); color: #0f172a; border-color: var(--accent); }

    /* Cards */
    .card { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 14px; margin-bottom: 12px; }
    .ex-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; margin-bottom: 4px; }
    .ex-title { font-size: 1rem; font-weight: 700; }
    .guide-btn { background: rgba(56, 189, 248, 0.14); border: 1px solid var(--accent); color: var(--accent); padding: 5px 9px; border-radius: 8px; font-size: 0.74rem; font-weight: 700; cursor: pointer; white-space: nowrap; }
    .ex-target { font-size: 0.76rem; color: var(--accent); margin-bottom: 8px; }
    .ex-note { font-size: 0.82rem; color: var(--muted); line-height: 1.4; margin-bottom: 10px; background: rgba(15, 23, 42, 0.55); padding: 8px 10px; border-radius: 8px; }

    /* Exercise-Specific Timers */
    .timer-chips { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; }
    .chip { background: rgba(245, 158, 11, 0.14); border: 1px solid var(--warn); color: var(--warn); padding: 5px 9px; border-radius: 8px; font-size: 0.74rem; font-weight: 700; cursor: pointer; }

    /* Writable Sets */
    .set-row { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
    .set-label { width: 46px; font-size: 0.8rem; font-weight: 700; color: var(--muted); }
    .set-input { flex: 1; background: var(--surface-2); border: 1px solid var(--border); color: var(--text); padding: 9px 10px; border-radius: 8px; font-size: 0.9rem; font-weight: 600; min-width: 0; }
    .set-input:focus { outline: none; border-color: var(--accent); }
    .set-done { width: 82px; padding: 9px 8px; border-radius: 8px; border: 1px solid var(--border); background: var(--surface-2); color: var(--text); font-size: 0.8rem; font-weight: 700; cursor: pointer; }
    .set-done.done { background: var(--success); border-color: var(--success); color: #052e16; }
    .set-controls { display: flex; gap: 8px; margin-top: 6px; }
    .small-btn { background: var(--surface-2); border: 1px solid var(--border); color: var(--muted); padding: 6px 10px; border-radius: 8px; font-size: 0.74rem; font-weight: 600; cursor: pointer; }

    /* Action Buttons */
    .primary-btn { width: 100%; padding: 14px; background: var(--success); color: #052e16; border: none; border-radius: 12px; font-size: 0.98rem; font-weight: 800; cursor: pointer; margin-top: 6px; }
    .btn-accent { background: var(--accent); color: #0f172a; border: none; padding: 10px 14px; border-radius: 10px; font-weight: 700; font-size: 0.84rem; cursor: pointer; }
    .btn-outline { background: var(--surface-2); color: var(--text); border: 1px solid var(--border); padding: 10px 14px; border-radius: 10px; font-weight: 700; font-size: 0.84rem; cursor: pointer; }
    .btn-danger { background: rgba(239, 68, 68, 0.16); color: #fca5a5; border: 1px solid var(--danger); padding: 10px 14px; border-radius: 10px; font-weight: 700; font-size: 0.84rem; cursor: pointer; }

    /* Bottom Sticky Timer */
    .timer-bar { position: fixed; bottom: 0; left: 0; right: 0; max-width: 640px; margin: 0 auto; background: #020617; border-top: 1px solid var(--border); padding: 10px 14px; display: flex; justify-content: space-between; align-items: center; gap: 8px; z-index: 45; }
    .timer-meta { font-size: 0.68rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.04em; max-width: 150px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .timer-clock { font-size: 1.4rem; font-weight: 800; color: var(--accent); font-variant-numeric: tabular-nums; line-height: 1.1; }
    .timer-clock.hold { color: var(--warn); }
    .timer-actions { display: flex; gap: 5px; flex-wrap: wrap; justify-content: flex-end; }
    .t-btn { background: var(--surface); border: 1px solid var(--border); color: var(--text); padding: 7px 9px; border-radius: 8px; font-size: 0.74rem; font-weight: 700; cursor: pointer; }
    .t-btn.stop { background: var(--accent); color: #0f172a; border-color: var(--accent); }

    /* Slide-Out Hamburger Drawer */
    .drawer-backdrop { position: fixed; inset: 0; background: rgba(2, 6, 23, 0.72); z-index: 70; display: none; }
    .drawer-backdrop.open { display: block; }
    .drawer { position: fixed; top: 0; left: 0; bottom: 0; width: 270px; max-width: 82vw; background: var(--surface); border-right: 1px solid var(--border); z-index: 75; transform: translateX(-100%); transition: transform 0.2s ease; display: flex; flex-direction: column; padding: 18px 14px; }
    .drawer.open { transform: translateX(0); }
    .drawer-header { display: flex; justify-content: space-between; align-items: center; padding-bottom: 14px; border-bottom: 1px solid var(--border); margin-bottom: 12px; }
    .nav-item { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; background: transparent; border: 1px solid transparent; color: var(--text); padding: 12px; border-radius: 10px; font-size: 0.92rem; font-weight: 700; cursor: pointer; margin-bottom: 6px; }
    .nav-item.active { background: rgba(56, 189, 248, 0.16); border-color: var(--accent); color: var(--accent); }

    /* Single-Back-Button Animated Form Guide Overlay */
    .overlay { position: fixed; inset: 0; background: var(--bg); z-index: 80; display: none; flex-direction: column; overflow-y: auto; max-width: 640px; margin: 0 auto; }
    .overlay.open { display: flex; }
    .overlay-top { position: sticky; top: 0; background: rgba(15, 23, 42, 0.96); border-bottom: 1px solid var(--border); padding: 12px 14px; display: flex; align-items: center; gap: 12px; z-index: 10; }
    .back-btn { background: var(--accent); color: #0f172a; border: none; padding: 8px 14px; border-radius: 10px; font-weight: 800; font-size: 0.85rem; cursor: pointer; }
    .overlay-body { padding: 16px 14px 40px; }
    .svg-stage { background: var(--surface-2); border: 1px solid var(--border); border-radius: 14px; padding: 10px 10px 12px; display: flex; flex-direction: column; align-items: center; margin-bottom: 14px; }
    .anim-hud { width: 100%; display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 6px; padding: 0 4px; }
    .phase-pill { font-size: 0.72rem; font-weight: 800; letter-spacing: 0.04em; text-transform: uppercase; color: #22c55e; background: rgba(34, 197, 94, 0.14); border: 1px solid rgba(34, 197, 94, 0.4); padding: 4px 9px; border-radius: 999px; }
    .anim-controls { display: flex; gap: 6px; }
    .anim-ctrl-btn { background: var(--surface); border: 1px solid var(--border); color: var(--text); padding: 4px 9px; border-radius: 7px; font-size: 0.72rem; font-weight: 700; cursor: pointer; }
    .anim-progress-track { width: 100%; height: 4px; background: #1e293b; border-radius: 999px; overflow: hidden; margin-top: 6px; }
    .anim-progress-fill { height: 100%; width: 0%; background: linear-gradient(90deg, #38bdf8, #22c55e); border-radius: 999px; }
    .cue-list { list-style: none; margin: 10px 0 16px; }
    .cue-list li { padding: 8px 10px; background: var(--surface); border-left: 3px solid var(--accent); border-radius: 6px; margin-bottom: 8px; font-size: 0.86rem; line-height: 1.4; }
    .row-btns { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }

    /* Charts, History, Backup, Reminders */
    .section-title { font-size: 1.1rem; font-weight: 800; margin-bottom: 12px; }
    select, textarea, input[type="time"] { width: 100%; background: var(--surface-2); border: 1px solid var(--border); color: var(--text); padding: 10px; border-radius: 10px; font-size: 0.88rem; margin-bottom: 10px; }
    .stat-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 12px; }
    .stat-box { background: var(--surface-2); border: 1px solid var(--border); border-radius: 10px; padding: 10px 8px; text-align: center; }
    .stat-val { font-size: 1.1rem; font-weight: 800; color: var(--accent); }
    .stat-lbl { font-size: 0.7rem; color: var(--muted); margin-top: 2px; }
    .pill-row { display: flex; gap: 6px; margin-bottom: 12px; flex-wrap: wrap; }
    .pill { background: var(--surface-2); border: 1px solid var(--border); color: var(--muted); padding: 7px 11px; border-radius: 999px; font-size: 0.76rem; font-weight: 700; cursor: pointer; }
    .pill.active { background: var(--accent); color: #0f172a; border-color: var(--accent); }
    .chart-box { background: var(--surface-2); border: 1px solid var(--border); border-radius: 12px; padding: 10px; margin-bottom: 10px; }
    .day-chip-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; margin-bottom: 12px; }
    .day-chip { padding: 9px 4px; border-radius: 8px; border: 1px solid var(--border); background: var(--surface-2); color: var(--muted); font-size: 0.74rem; font-weight: 700; text-align: center; cursor: pointer; }
    .day-chip.active { background: var(--accent); color: #0f172a; border-color: var(--accent); }
    .hist-card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 12px; margin-bottom: 10px; }
    .hist-head { display: flex; justify-content: space-between; align-items: center; cursor: pointer; }
    .hist-detail { margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--border); font-size: 0.82rem; color: var(--muted); display: none; }
    .hist-detail.open { display: block; }
    .toast { position: fixed; top: 68px; left: 50%; transform: translateX(-50%); background: var(--success); color: #052e16; padding: 9px 16px; border-radius: 999px; font-weight: 800; font-size: 0.82rem; z-index: 95; display: none; box-shadow: 0 8px 24px rgba(0,0,0,0.4); }
    .toast.show { display: block; }
  </style>
  <script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
  <script>
    window.OneSignalDeferred = window.OneSignalDeferred || [];
    window.oneSignalReady = false;
    window.oneSignalOptedIn = false;
    OneSignalDeferred.push(async function(OneSignal) {
      await OneSignal.init({
        appId: "b0207ebd-45cc-4ca7-bd67-c2d0298abec9",
        serviceWorkerPath: "Recomp-Exercise-Tracker/push/onesignal/OneSignalSDKWorker.js",
        serviceWorkerParam: { scope: "/Recomp-Exercise-Tracker/push/onesignal/" },
        notifyButton: { enable: false }
      });
      window.oneSignalReady = true;
      window.oneSignalOptedIn = Boolean(OneSignal.User.PushSubscription.optedIn);
      OneSignal.User.PushSubscription.addEventListener("change", (event) => {
        window.oneSignalOptedIn = Boolean(event.current.optedIn);
        if (typeof syncOneSignalSchedule === "function") syncOneSignalSchedule(false);
        if (typeof currentView !== "undefined" && currentView === "reminders") render();
      });
      if (typeof syncOneSignalSchedule === "function") syncOneSignalSchedule(false);
      if (typeof currentView !== "undefined" && currentView === "reminders") render();
    });
  </script>
</head>
<body>
  <div id="toast" class="toast"></div>

  <!-- Top Bar -->
  <header class="topbar">
    <div class="topbar-left">
      <button class="menu-btn" onclick="openDrawer()" aria-label="Open menu">☰</button>
      <div class="brand">
        <h1>3-Day Recomp Tracker</h1>
        <small>Mon / Wed / Fri Home Plan</small>
      </div>
    </div>
    <div class="badge" id="weeklyBadge">0 / 3 Week</div>
  </header>

  <!-- PWA Install Prompt Banner -->
  <div id="installBanner" class="install-banner">
    <span>Install this tracker on your home screen for offline use.</span>
    <button class="install-btn" id="installBtn">Install App</button>
  </div>

  <!-- Slide-out Navigation Drawer -->
  <div id="drawerBackdrop" class="drawer-backdrop" onclick="closeDrawer()"></div>
  <aside id="drawer" class="drawer">
    <div class="drawer-header">
      <strong>Navigation</strong>
      <button class="small-btn" onclick="closeDrawer()">✕</button>
    </div>
    <button class="nav-item active" data-view="workouts" onclick="setView('workouts')">🏋️ Workouts</button>
    <button class="nav-item" data-view="charts" onclick="setView('charts')">📈 Progress Charts</button>
    <button class="nav-item" data-view="history" onclick="setView('history')">📅 Workout History</button>
    <button class="nav-item" data-view="backup" onclick="setView('backup')">💾 Import / Export</button>
    <button class="nav-item" data-view="reminders" onclick="setView('reminders')">🔔 Reminders</button>
    <div style="margin-top:auto;padding-top:12px;border-top:1px solid var(--border);">
      <button class="nav-item" onclick="forceUpdatePWA()" style="margin-bottom:0;color:var(--accent);">🔄 Check for Updates</button>
    </div>
  </aside>

  <!-- Main View Area -->
  <main id="app"></main>

  <!-- Single-Back-Button Animated Form Guide Overlay -->
  <div id="guideOverlay" class="overlay">
    <div class="overlay-top">
      <button class="back-btn" onclick="closeGuide()">← Back to Exercises</button>
      <strong id="guideTitle" style="font-size:0.95rem;">Exercise Guide</strong>
    </div>
    <div class="overlay-body" id="guideBody"></div>
  </div>

  <!-- Sticky Bottom Timer Bar -->
  <div class="timer-bar">
    <div>
      <div class="timer-meta" id="timerLabel">REST TIMER (60s)</div>
      <div class="timer-clock" id="timerClock">01:00</div>
    </div>
    <div class="timer-actions">
      <button class="t-btn" onclick="startTimer(20, '20s Hold', true)">20s</button>
      <button class="t-btn" onclick="startTimer(30, '30s Hold', true)">30s</button>
      <button class="t-btn" onclick="startTimer(45, '45s Hold', true)">45s</button>
      <button class="t-btn" onclick="startTimer(60, '60s Rest', false)">60s</button>
      <button class="t-btn stop" onclick="stopTimer()">Stop</button>
    </div>
  </div>

  <script>
    // --- PWA Service Worker Registration & Instant Updates ---
    let swReg = null;
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js', { updateViaCache: 'none' }).then((reg) => {
          swReg = reg;
          reg.update().catch(() => {});
        }).catch(() => {});
      });
      let refreshing = false;
      navigator.serviceWorker.addEventListener('controllerchange', () => {
        if (!refreshing) {
          refreshing = true;
          window.location.reload();
        }
      });
    }

    async function forceUpdatePWA() {
      closeDrawer(true);
      showToast('Checking for updates...');
      try {
        if (swReg) await swReg.update();
        if ('caches' in window) {
          const keys = await caches.keys();
          await Promise.all(keys.map(k => caches.delete(k)));
        }
        window.location.reload(true);
      } catch (e) {
        window.location.reload();
      }
    }
    let deferredPrompt = null;
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      document.getElementById('installBanner').classList.add('show');
    });
    document.getElementById('installBtn').addEventListener('click', async () => {
      if (!deferredPrompt) return;
      deferredPrompt.prompt();
      await deferredPrompt.userChoice;
      deferredPrompt = null;
      document.getElementById('installBanner').classList.remove('show');
    });

    // --- Workout Plan Data (Overhead Tricep Extensions on Day 1) ---

      {

            ytQuery: 'incline push ups proper form tutorial', anim: 'pushup'
          },

            cues: ['Keep heels planted flat on the floor.', 'Track knees in line with your toes.', 'Squeeze glutes gently at the top.'],

            ytQuery: 'bodyweight squat proper form beginners', anim: 'squat'
          },

            timers: [{ label: '3s Lowering Tempo', sec: 3 }, { label: '60s Rest', sec: 60, isRest: true }],
            ytQuery: 'two hand overhead tricep extension proper form', anim: 'tricep'
          },

            cues: ['Glue your lower back to the floor the entire time.', 'Exhale as you extend arm and leg.', 'Move slowly—do not let ribs flare.'],
            timers: [{ label: '45s Set Pacer', sec: 45 }, { label: '60s Rest', sec: 60, isRest: true }],
            ytQuery: 'dead bug exercise proper form core', anim: 'deadbug'

          },
          {
            id: 'd2_e3', name: 'Reverse Lunges', unit: 'reps', target: '3 sets × 10 reps/leg • Thighs & Glutes',

            timers: [{ label: '45s Set Pacer', sec: 45 }, { label: '60s Rest', sec: 60, isRest: true }],
            ytQuery: 'reverse lunge proper form beginners', anim: 'lunge'
          },

    // --- State Management ---
    const STORAGE_KEY = 'recomp_pwa_state_v1';
    function defaultState() {
      return {
        drafts: {}, // { exId: [{ val: '', done: false }, ...] }
        history: [], // [{ id, dayIdx, title, date, ts, exercises: [{ id, name, unit, sets: [num] }] }]
        notif: { enabled: true, days: [1, 3, 5], time: '10:00' },
        lastBackup: null
      };
    }

    let state = defaultState();
    try {
      const saved = localStorage.getItem(STORAGE_KEY);
      if (saved) state = Object.assign(defaultState(), JSON.parse(saved));
    } catch (e) {}

    let currentView = 'workouts';
    let currentDay = 0;
    let chartExercise = 'all';
    let chartMetric = 'volume';
    let useSampleData = false;
    let selectedPointIdx = null;
    let timerInterval = null;
    let timeLeft = 60;
    let lastNotifFiredKey = '';

    function saveState() {
      try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (e) {}
      updateWeeklyBadge();
    }

      const el = document.getElementById('toast');

      if (!state.drafts[exId] || !state.drafts[exId].length) {
        state.drafts[exId] = [{ val: '', done: false }, { val: '', done: false }, { val: '', done: false }];
      }
      return state.drafts[exId];
    }

    function updateWeeklyBadge() {
      const weekAgo = Date.now() - 7 * 24 * 60 * 60 * 1000;
      const count = state.history.filter(h => h.ts >= weekAgo).length;
      document.getElementById('weeklyBadge').textContent = `${count} / 3 Week`;

    // --- Navigation & Android Back Button Support ---

    function closeDrawer(fromPop = false) {

      document.getElementById('drawerBackdrop').classList.remove('open');
      if (!fromPop && history.state && history.state.modal === 'drawer') history.back();

    function setView(view) {
      currentView = view;
      closeDrawer(true);
      document.querySelectorAll('.nav-item').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.view === view);
      });

    // --- 60fps Multi-Joint Skeletal Form Animator ---
    let animRafId = null;
    let animStartTs = null;
    let animPaused = false;
    let animPauseElapsed = 0;
    let animSpeed = 1.0;
    let activeAnimExId = null;

    function openGuide(dayIdx, exIdx) {
      const ex = WORKOUTS[dayIdx].exercises[exIdx];
      activeAnimExId = ex.id;
      animPaused = false;
      animPauseElapsed = 0;
      animSpeed = 1.0;
      animStartTs = null;

      document.getElementById('guideTitle').textContent = ex.name;
      const ytUrl = `https://www.youtube.com/results?search_query=${encodeURIComponent(ex.ytQuery)}`;
      const intentUrl = `intent://www.youtube.com/results?search_query=${encodeURIComponent(ex.ytQuery)}#Intent;package=com.google.android.youtube;scheme=https;end`;

      document.getElementById('guideBody').innerHTML = `
        <div class="svg-stage">
          <div class="anim-hud">
            <span id="animPhaseLabel" class="phase-pill">READY</span>
            <div class="anim-controls">
              <button id="animPlayBtn" class="anim-ctrl-btn" onclick="toggleAnimPlay()">⏸ Pause</button>
              <button id="animSpeedBtn" class="anim-ctrl-btn" onclick="toggleAnimSpeed()">1.0x</button>
            </div>
          </div>
          <svg id="formAnimSvg" viewBox="0 0 280 210" width="100%" style="max-width:300px;height:auto;display:block;"></svg>
          <div class="anim-progress-track"><div id="animProgressFill" class="anim-progress-fill"></div></div>
        </div>
        <div class="ex-target" style="font-size:0.84rem;">${ex.target}</div>
        <p style="font-size:0.9rem;color:var(--muted);line-height:1.45;margin-bottom:12px;">${ex.how}</p>
        <strong style="font-size:0.88rem;">Key Form Checkpoints</strong>
        <ul class="cue-list">${ex.cues.map(c => `<li>${c}</li>`).join('')}</ul>
        <div class="timer-chips">
          ${ex.timers.map(t => `<button class="chip" onclick="startTimer(${t.sec}, '${ex.name}: ${t.label}', ${!t.isRest})">⏱ ${t.label}</button>`).join('')}
        </div>
        <div class="row-btns">
          <a class="btn-accent" style="text-decoration:none;display:inline-block;" href="${intentUrl}">📺 Open in YouTube App</a>
          <button class="btn-outline" onclick="copyText('${ytUrl}', 'YouTube link copied!')">📋 Copy Video Link</button>
        </div>
      `;
      document.getElementById('guideOverlay').classList.add('open');
      history.pushState({ modal: 'guide' }, '');
      startFormAnimation();
    }

    function closeGuide(fromPop = false) {
      stopFormAnimation();
      document.getElementById('guideOverlay').classList.remove('open');
      if (!fromPop && history.state && history.state.modal === 'guide') history.back();
    }

    function toggleAnimPlay() {
      animPaused = !animPaused;
      const btn = document.getElementById('animPlayBtn');
      if (btn) btn.textContent = animPaused ? '▶ Play' : '⏸ Pause';
      if (!animPaused) {
        animStartTs = performance.now() - animPauseElapsed;
        animRafId = requestAnimationFrame(tickFormAnimation);
      } else if (animRafId) {
        cancelAnimationFrame(animRafId);
        animRafId = null;
      }
    }

    function toggleAnimSpeed() {
      animSpeed = animSpeed === 1.0 ? 0.5 : (animSpeed === 0.5 ? 1.5 : 1.0);
      const btn = document.getElementById('animSpeedBtn');
      if (btn) btn.textContent = animSpeed.toFixed(1) + 'x';
    }

    function startFormAnimation() {
      stopFormAnimation();
      animStartTs = performance.now();
      animRafId = requestAnimationFrame(tickFormAnimation);
    }

    function stopFormAnimation() {
      if (animRafId) {
        cancelAnimationFrame(animRafId);
        animRafId = null;
      }
    }

    function tickFormAnimation(now) {
      if (animPaused || !activeAnimExId) return;
      const svg = document.getElementById('formAnimSvg');
      if (!svg) return;

      const cycleMs = 4200 / animSpeed;
      animPauseElapsed = now - animStartTs;
      const p = ((animPauseElapsed % cycleMs) / cycleMs);

      const frame = getExerciseFrame(activeAnimExId, p);
      svg.innerHTML = frame.svg;

      const phaseEl = document.getElementById('animPhaseLabel');
      if (phaseEl) phaseEl.textContent = frame.phase;
      const progEl = document.getElementById('animProgressFill');
      if (progEl) progEl.style.width = `${(p * 100).toFixed(1)}%`;

      animRafId = requestAnimationFrame(tickFormAnimation);
    }

    window.addEventListener('popstate', () => {
      if (document.getElementById('guideOverlay').classList.contains('open')) {
        closeGuide(true);
      } else if (document.getElementById('drawer').classList.contains('open')) {
        closeDrawer(true);
      }
    });

    // Math & skeletal drawing helpers
    function lerp(a, b, t) { return a + (b - a) * t; }
    function ease(t) { return 0.5 - 0.5 * Math.cos(Math.max(0, Math.min(1, t)) * Math.PI); }
    function pt(x, y) { return { x, y }; }
    function lerpPt(a, b, t) { return { x: lerp(a.x, b.x, t), y: lerp(a.y, b.y, t) }; }

    function seg(a, b, color = '#38bdf8', width = 6.5, opacity = 1) {
      return `<line x1="${a.x.toFixed(1)}" y1="${a.y.toFixed(1)}" x2="${b.x.toFixed(1)}" y2="${b.y.toFixed(1)}" stroke="${color}" stroke-width="${width}" stroke-linecap="round" opacity="${opacity}"/>`;
    }
    function joint(p, r = 3.5, color = '#e2e8f0', opacity = 1) {
      return `<circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="${r}" fill="${color}" opacity="${opacity}"/>`;
    }
    function headCircle(p, r = 11.5) {
      return `<circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="${r}" fill="#f8fafc" stroke="#38bdf8" stroke-width="2"/>`;
    }
    function glowHalo(p, r, intensity = 0.5) {
      return `<circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="${r}" fill="#22c55e" opacity="${(0.16 + 0.34 * intensity).toFixed(2)}"/>`;
    }
    function floorMat(y = 180) {
      return `
        <line x1="14" y1="${y}" x2="266" y2="${y}" stroke="#334155" stroke-width="3" stroke-linecap="round"/>
        <rect x="34" y="${y - 4}" width="212" height="5" rx="2.5" fill="#1e293b" stroke="#475569" stroke-width="1"/>
      `;
    }

    function drawSkeleton(pose, opts = {}) {
      const farC = '#1d4ed8';
      const nearC = '#38bdf8';
      const torsoC = opts.torsoGlow ? '#22c55e' : '#7dd3fc';
      let out = '';

      // Muscle highlight halos
      if (opts.glows) {
        opts.glows.forEach(g => { out += glowHalo(g.p, g.r, g.i); });
      }

      // Far limbs (behind torso)
      if (pose.hip && pose.kneeF && pose.ankleF) {
        out += seg(pose.hip, pose.kneeF, opts.legFGlow ? '#16a34a' : farC, 6, 0.85);
        out += seg(pose.kneeF, pose.ankleF, opts.calfGlow ? '#16a34a' : farC, 5.5, 0.85);
        if (pose.footF) out += seg(pose.ankleF, pose.footF, farC, 4.5, 0.85);
      }
      if (pose.shoulder && pose.elbowF && pose.wristF) {
        out += seg(pose.shoulder, pose.elbowF, opts.armFGlow ? '#16a34a' : farC, 5.5, 0.85);
        out += seg(pose.elbowF, pose.wristF, farC, 5, 0.85);
      }

      // Torso & Neck
      if (pose.hip && pose.shoulder) {
        out += seg(pose.hip, pose.shoulder, torsoC, 9.5, 1);
      }
      if (pose.shoulder && pose.head) {
        out += seg(pose.shoulder, pose.head, '#cbd5e1', 5, 1);
        out += headCircle(pose.head, opts.headR || 11.5);
      }

      // Near limbs (in front of torso)
      if (pose.hip && pose.kneeN && pose.ankleN) {
        out += seg(pose.hip, pose.kneeN, opts.legNGlow ? '#22c55e' : nearC, 7, 1);
        out += seg(pose.kneeN, pose.ankleN, opts.calfGlow ? '#22c55e' : nearC, 6.2, 1);
        if (pose.footN) out += seg(pose.ankleN, pose.footN, '#e2e8f0', 4.8, 1);
        out += joint(pose.kneeN, 3.6);
        out += joint(pose.ankleN, 3.0);
      }
      if (pose.shoulder && pose.elbowN && pose.wristN) {
        out += seg(pose.shoulder, pose.elbowN, opts.armNGlow ? '#22c55e' : nearC, 6.2, 1);
        out += seg(pose.elbowN, pose.wristN, opts.forearmNGlow ? '#22c55e' : nearC, 5.5, 1);
        out += joint(pose.elbowN, 3.3);
        out += joint(pose.wristN, 3.0, '#f8fafc');
      }

      if (pose.hip) out += joint(pose.hip, 4.2, '#f8fafc');
      if (pose.shoulder) out += joint(pose.shoulder, 4.2, '#f8fafc');
      return out;
    }

    function getExerciseFrame(exId, p) {
      let svg = '';
      let phase = '';

      // 1. Incline Push-Ups (3s slow lower, press up)
      if (exId === 'd1_e1') {
        let t, ph;
        if (p < 0.62) { t = ease(p / 0.62); ph = 'LOWER SLOWLY (3s)'; }
        else if (p < 0.72) { t = 1; ph = 'CHEST TO EDGE'; }
        else { t = 1 - ease((p - 0.72) / 0.28); ph = 'PRESS UP'; }

        const bench = `<rect x="192" y="106" width="66" height="74" rx="5" fill="#1e293b" stroke="#475569" stroke-width="2"/>`;
        const ankle = pt(48, 174);
        const foot = pt(44, 180);
        const wrist = pt(200, 106);

        const shoulder = lerpPt(pt(186, 68), pt(196, 102), t);
        const hip = lerpPt(pt(118, 118), pt(124, 136), t);
        const knee = lerpPt(pt(83, 146), pt(86, 155), t);
        const head = lerpPt(pt(204, 54), pt(214, 90), t);
        const elbowN = lerpPt(pt(193, 88), pt(176, 118), t);
        const elbowF = lerpPt(pt(198, 86), pt(182, 114), t);

        svg = floorMat(180) + bench + drawSkeleton(
          { head, shoulder, hip, kneeN: knee, kneeF: pt(knee.x - 4, knee.y + 2), ankleN: ankle, ankleF: pt(ankle.x - 4, ankle.y), footN: foot, elbowN, wristN: wrist, elbowF, wristF: pt(wrist.x + 5, wrist.y) },
          { armNGlow: t > 0.35, glows: [{ p: shoulder, r: 16, i: t }] }
        );
        phase = ph;
      }

      // 2. Bodyweight Squats
      else if (exId === 'd1_e2') {
        let t, ph;
        if (p < 0.45) { t = ease(p / 0.45); ph = 'SIT HIPS BACK'; }
        else if (p < 0.58) { t = 1; ph = 'THIGHS PARALLEL'; }
        else { t = 1 - ease((p - 0.58) / 0.42); ph = 'DRIVE THROUGH HEELS'; }

        const ankleN = pt(142, 174), footN = pt(158, 176);
        const ankleF = pt(132, 174), footF = pt(148, 176);
        const kneeN = lerpPt(pt(144, 134), pt(164, 138), t);
        const kneeF = lerpPt(pt(134, 134), pt(154, 138), t);
        const hip = lerpPt(pt(136, 96), pt(106, 136), t);
        const shoulder = lerpPt(pt(138, 48), pt(132, 92), t);
        const head = lerpPt(pt(140, 29), pt(142, 74), t);
        const elbowN = lerpPt(pt(136, 76), pt(164, 92), t);
        const wristN = lerpPt(pt(140, 102), pt(194, 88), t);
        const elbowF = lerpPt(pt(130, 76), pt(156, 90), t);
        const wristF = lerpPt(pt(134, 102), pt(186, 86), t);

        svg = floorMat(180) + drawSkeleton(
          { head, shoulder, hip, kneeN, kneeF, ankleN, ankleF, footN, footF, elbowN, wristN, elbowF, wristF },
          { legNGlow: t > 0.3, legFGlow: t > 0.3, glows: [{ p: lerpPt(hip, kneeN, 0.5), r: 18, i: t }] }
        );
        phase = ph;
      }

      // 3. Overhead Tricep Extensions (Wrist-Friendly, 3s lower)
      else if (exId === 'd1_e3') {
        let t, ph;
        if (p < 0.58) { t = ease(p / 0.58); ph = 'LOWER BEHIND HEAD (3s)'; }
        else if (p < 0.68) { t = 1; ph = 'DEEP TRICEP STRETCH'; }
        else { t = 1 - ease((p - 0.68) / 0.32); ph = 'EXTEND OVERHEAD'; }

        const ankleN = pt(138, 174), footN = pt(154, 176);
        const ankleF = pt(128, 174), footF = pt(144, 176);
        const kneeN = pt(138, 136), kneeF = pt(128, 136);
        const hip = pt(134, 100);
        const shoulder = pt(134, 56);
        const head = pt(138, 38);
        // Upper arms stay locked vertically next to ears
        const elbowN = pt(130, 24);
        const elbowF = pt(138, 24);
        // Forearms hinge behind head from straight up to behind upper back
        const ang = lerp(-Math.PI / 2, -Math.PI * 1.18, t);
        const foreLen = 28;
        const wristN = pt(elbowN.x + Math.cos(ang) * foreLen, elbowN.y + Math.sin(ang) * foreLen);
        const wristF = pt(elbowF.x + Math.cos(ang) * foreLen, elbowF.y + Math.sin(ang) * foreLen);

        // Household weight / water jug held in both hands
        const wCenter = lerpPt(wristN, wristF, 0.5);
        const weight = `<g transform="translate(${wCenter.x.toFixed(1)},${wCenter.y.toFixed(1)}) rotate(${(t * -90).toFixed(1)})">
          <rect x="-11" y="-8" width="22" height="16" rx="4" fill="#f59e0b" stroke="#fef3c7" stroke-width="1.5"/>
          <line x1="-5" y1="0" x2="5" y2="0" stroke="#78350f" stroke-width="2.5" stroke-linecap="round"/>
        </g>`;

        svg = floorMat(180) + drawSkeleton(
          { head, shoulder, hip, kneeN, kneeF, ankleN, ankleF, footN, footF, elbowN, wristN, elbowF, wristF },
          { armNGlow: true, armFGlow: true, glows: [{ p: lerpPt(shoulder, elbowN, 0.5), r: 15, i: 0.4 + 0.6 * t }] }
        ) + weight;
        phase = ph;
      }

      // 4. Dead Bugs (Alternating opposite arm & leg)
      else if (exId === 'd1_e4') {
        const isFirstHalf = p < 0.5;
        const sub = isFirstHalf ? p * 2 : (p - 0.5) * 2;
        const t = sub < 0.5 ? ease(sub * 2) : 1 - ease((sub - 0.5) * 2);
        phase = isFirstHalf ? (sub < 0.5 ? 'EXTEND RIGHT ARM + LEFT LEG' : 'RETURN TO CENTER') : (sub < 0.5 ? 'EXTEND LEFT ARM + RIGHT LEG' : 'RETURN TO CENTER');

        const head = pt(56, 162);
        const shoulder = pt(82, 168);
        const hip = pt(154, 168);

        const tN = isFirstHalf ? t : 0;
        const tF = isFirstHalf ? 0 : t;

        // Near arm & far leg move together; far arm & near leg move together
        const elbowN = lerpPt(pt(82, 144), pt(52, 158), tN);
        const wristN = lerpPt(pt(82, 120), pt(24, 158), tN);
        const elbowF = lerpPt(pt(88, 144), pt(58, 158), tF);
        const wristF = lerpPt(pt(88, 120), pt(30, 158), tF);

        const kneeF = lerpPt(pt(154, 132), pt(194, 160), tN);
        const ankleF = lerpPt(pt(188, 132), pt(234, 162), tN);
        const kneeN = lerpPt(pt(148, 132), pt(190, 162), tF);
        const ankleN = lerpPt(pt(182, 132), pt(230, 164), tF);

        svg = floorMat(180) + drawSkeleton(
          { head, shoulder, hip, kneeN, kneeF, ankleN, ankleF, elbowN, wristN, elbowF, wristF },
          { torsoGlow: true, glows: [{ p: lerpPt(shoulder, hip, 0.55), r: 18, i: 0.5 + 0.5 * t }] }
        );
      }

      // 5. Forearm Plank (Isometric core & glute brace)
      else if (exId === 'd1_e5') {
        const pulse = ease(p < 0.5 ? p * 2 : (1 - p) * 2);
        phase = p < 0.5 ? 'BRACE ABS & GLUTES' : 'BREATHE STEADY • HOLD';

        const head = pt(56, 114 + pulse * 1.5);
        const shoulder = pt(82, 122 + pulse * 1.5);
        const hip = pt(152, 132);
        const kneeN = pt(196, 152);
        const ankleN = pt(234, 174);
        const footN = pt(236, 180);
        const elbowN = pt(82, 174);
        const wristN = pt(56, 174);

        const alignLine = `<line x1="68" y1="116" x2="236" y2="170" stroke="#22c55e" stroke-width="1.5" stroke-dasharray="5 5" opacity="${(0.35 + 0.4 * pulse).toFixed(2)}"/>`;
        svg = floorMat(180) + alignLine + drawSkeleton(
          { head, shoulder, hip, kneeN, kneeF: pt(kneeN.x - 4, kneeN.y + 2), ankleN, ankleF: pt(ankleN.x - 4, ankleN.y), footN, elbowN, wristN, elbowF: pt(elbowN.x + 6, elbowN.y), wristF: pt(wristN.x + 6, wristN.y) },
          { torsoGlow: true, glows: [{ p: lerpPt(shoulder, hip, 0.55), r: 20, i: pulse }] }
        );
      }

      // 6. Doorframe or Towel Rows (2s peak squeeze)
      else if (exId === 'd2_e1') {
        let t, ph;
        if (p < 0.35) { t = ease(p / 0.35); ph = 'PULL CHEST FORWARD'; }
        else if (p < 0.65) { t = 1; ph = 'SQUEEZE SHOULDER BLADES (2s)'; }
        else { t = 1 - ease((p - 0.65) / 0.35); ph = 'LOWER WITH CONTROL'; }

        const frame = `<rect x="208" y="18" width="14" height="162" rx="2" fill="#334155" stroke="#64748b" stroke-width="2"/>`;
        const ankleN = pt(190, 174), footN = pt(204, 176);
        const ankleF = pt(182, 174), footF = pt(196, 176);
        const kneeN = lerpPt(pt(164, 140), pt(178, 138), t);
        const hip = lerpPt(pt(138, 106), pt(164, 104), t);
        const shoulder = lerpPt(pt(114, 68), pt(154, 62), t);
        const head = lerpPt(pt(104, 50), pt(148, 44), t);
        const wristN = pt(208, 76);
        const elbowN = lerpPt(pt(160, 74), pt(132, 82), t);
        const elbowF = lerpPt(pt(166, 72), pt(138, 80), t);

        svg = floorMat(180) + frame + drawSkeleton(
          { head, shoulder, hip, kneeN, kneeF: pt(kneeN.x - 6, kneeN.y), ankleN, ankleF, footN, footF, elbowN, wristN, elbowF, wristF: pt(wristN.x, wristN.y - 3) },
          { armNGlow: t > 0.4, glows: [{ p: shoulder, r: 17, i: t }] }
        );
        phase = ph;
      }

      // 7. Glute Bridges (2s top squeeze)
      else if (exId === 'd2_e2') {
        let t, ph;
        if (p < 0.32) { t = ease(p / 0.32); ph = 'DRIVE THROUGH HEELS'; }
        else if (p < 0.65) { t = 1; ph = 'SQUEEZE GLUTES (2s)'; }
        else { t = 1 - ease((p - 0.65) / 0.35); ph = 'LOWER HIPS SLOWLY'; }

        const head = pt(50, 162);
        const shoulder = pt(74, 168);
        const hip = lerpPt(pt(142, 172), pt(142, 126), t);
        const kneeN = lerpPt(pt(184, 124), pt(188, 118), t);
        const ankleN = pt(204, 174), footN = pt(220, 176);
        const elbowN = pt(100, 174), wristN = pt(132, 174);

        svg = floorMat(180) + drawSkeleton(
          { head, shoulder, hip, kneeN, kneeF: pt(kneeN.x - 6, kneeN.y + 2), ankleN, ankleF: pt(ankleN.x - 6, ankleN.y), footN, elbowN, wristN },
          { legNGlow: t > 0.35, torsoGlow: t > 0.6, glows: [{ p: hip, r: 19, i: t }] }
        );
        phase = ph;
      }

      // 8. Reverse Lunges (Alternating sides)
      else if (exId === 'd2_e3') {
        const isRight = p < 0.5;
        const sub = isRight ? p * 2 : (p - 0.5) * 2;
        const t = sub < 0.45 ? ease(sub / 0.45) : (sub < 0.6 ? 1 : 1 - ease((sub - 0.6) / 0.4));
        phase = sub < 0.45 ? 'STEP BACK & LOWER (90°)' : (sub < 0.6 ? 'HOLD BALANCE' : 'DRIVE UP FRONT HEEL');

        const hip = lerpPt(pt(144, 96), pt(140, 128), t);
        const shoulder = lerpPt(pt(144, 48), pt(142, 80), t);
        const head = lerpPt(pt(146, 28), pt(144, 60), t);

        const frontAnkle = pt(168, 174), frontFoot = pt(184, 176);
        const frontKnee = lerpPt(pt(148, 136), pt(170, 134), t);
        const backKnee = lerpPt(pt(140, 136), pt(110, 166), t);
        const backAnkle = lerpPt(pt(140, 174), pt(78, 172), t);
        const backFoot = lerpPt(pt(154, 176), pt(74, 180), t);

        const elbowN = lerpPt(pt(140, 78), pt(136, 108), t);
        const wristN = lerpPt(pt(144, 104), pt(156, 118), t);

        const pose = isRight
          ? { head, shoulder, hip, kneeN: frontKnee, ankleN: frontAnkle, footN: frontFoot, kneeF: backKnee, ankleF: backAnkle, footF: backFoot, elbowN, wristN }
          : { head, shoulder, hip, kneeN: backKnee, ankleN: backAnkle, footN: backFoot, kneeF: frontKnee, ankleF: frontAnkle, footF: frontFoot, elbowN, wristN };

        svg = floorMat(180) + drawSkeleton(pose, { legNGlow: t > 0.3, legFGlow: t > 0.3, glows: [{ p: lerpPt(hip, frontKnee, 0.5), r: 17, i: t }] });
      }

      // 9. Side Planks (Isometric oblique lift)
      else if (exId === 'd2_e4') {
        const pulse = ease(p < 0.5 ? p * 2 : (1 - p) * 2);
        phase = p < 0.5 ? 'LIFT HIPS HIGH' : 'HOLD DIAGONAL LINE';

        const head = pt(64, 94 - pulse * 2);
        const shoulder = pt(86, 106 - pulse * 2);
        const hip = pt(148, 134 - pulse * 3);
        const kneeN = pt(190, 154);
        const ankleN = pt(230, 174);
        const elbowF = pt(86, 174), wristF = pt(62, 174);
        const elbowN = pt(88, 72 - pulse * 2), wristN = pt(88, 40 - pulse * 2);

        svg = floorMat(180) + drawSkeleton(
          { head, shoulder, hip, kneeN, kneeF: pt(kneeN.x, kneeN.y + 4), ankleN, ankleF: pt(ankleN.x, ankleN.y + 3), elbowN, wristN, elbowF, wristF },
          { torsoGlow: true, glows: [{ p: lerpPt(shoulder, hip, 0.6), r: 19, i: 0.4 + 0.6 * pulse }] }
        );
      }

      // 10. Bird-Dogs (Alternating opposite reach + 2s hold)
      else if (exId === 'd2_e5') {
        const isFirst = p < 0.5;
        const sub = isFirst ? p * 2 : (p - 0.5) * 2;
        const t = sub < 0.3 ? ease(sub / 0.3) : (sub < 0.7 ? 1 : 1 - ease((sub - 0.7) / 0.3));
        phase = sub < 0.3 ? 'REACH OPPOSITE ARM & LEG' : (sub < 0.7 ? 'HOLD LEVEL HIPS (2s)' : 'RETURN UNDER CONTROL');

        const head = pt(80, 96);
        const shoulder = pt(102, 108);
        const hip = pt(168, 108);

        const tN = isFirst ? t : 0;
        const tF = isFirst ? 0 : t;

        const elbowN = lerpPt(pt(102, 142), pt(68, 104), tN);
        const wristN = lerpPt(pt(102, 174), pt(34, 102), tN);
        const elbowF = lerpPt(pt(108, 142), pt(74, 104), tF);
        const wristF = lerpPt(pt(108, 174), pt(40, 102), tF);

        const kneeF = lerpPt(pt(166, 172), pt(208, 108), tN);
        const ankleF = lerpPt(pt(194, 174), pt(246, 108), tN);
        const kneeN = lerpPt(pt(160, 172), pt(204, 110), tF);
        const ankleN = lerpPt(pt(188, 174), pt(242, 110), tF);

        svg = floorMat(180) + drawSkeleton(
          { head, shoulder, hip, kneeN, kneeF, ankleN, ankleF, elbowN, wristN, elbowF, wristF },
          { torsoGlow: true, glows: [{ p: lerpPt(shoulder, hip, 0.55), r: 17, i: 0.3 + 0.7 * t }] }
        );
      }

      // 11. Wall Sit (90-degree isometric hold)
      else if (exId === 'd3_e1') {
        const pulse = ease(p < 0.5 ? p * 2 : (1 - p) * 2);
        phase = p < 0.5 ? 'BACK FLAT • 90° KNEES' : 'WEIGHT IN HEELS • HOLD';

        const wall = `<rect x="74" y="18" width="14" height="162" rx="2" fill="#334155" stroke="#64748b" stroke-width="2"/>`;
        const head = pt(102, 54);
        const shoulder = pt(98, 74);
        const hip = pt(98, 126);
        const kneeN = pt(154, 126);
        const ankleN = pt(154, 174), footN = pt(172, 176);
        const elbowN = pt(102, 106), wristN = pt(122, 102);

        svg = floorMat(180) + wall + drawSkeleton(
          { head, shoulder, hip, kneeN, kneeF: pt(kneeN.x - 6, kneeN.y + 2), ankleN, ankleF: pt(ankleN.x - 6, ankleN.y), footN, elbowN, wristN },
          { legNGlow: true, legFGlow: true, glows: [{ p: lerpPt(hip, kneeN, 0.55), r: 19, i: 0.4 + 0.6 * pulse }] }
        );
      }

      // 12. Push-Up to Shoulder Tap (Push-up + alternating shoulder taps)
      else if (exId === 'd3_e2') {
        let puT = 0, tapL = 0, tapR = 0;
        if (p < 0.45) {
          const s = p / 0.45;
          puT = s < 0.5 ? ease(s * 2) : 1 - ease((s - 0.5) * 2);
          phase = s < 0.5 ? 'LOWER PUSH-UP' : 'PRESS TO PLANK';
        } else if (p < 0.72) {
          const s = (p - 0.45) / 0.27;
          tapL = s < 0.5 ? ease(s * 2) : 1 - ease((s - 0.5) * 2);
          phase = 'TAP OPPOSITE SHOULDER (L)';
        } else {
          const s = (p - 0.72) / 0.28;
          tapR = s < 0.5 ? ease(s * 2) : 1 - ease((s - 0.5) * 2);
          phase = 'TAP OPPOSITE SHOULDER (R)';
        }

        const ankle = pt(46, 174), foot = pt(42, 180);
        const shoulder = lerpPt(pt(184, 106), pt(188, 144), puT);
        const hip = lerpPt(pt(116, 138), pt(118, 156), puT);
        const knee = lerpPt(pt(82, 156), pt(82, 165), puT);
        const head = lerpPt(pt(204, 96), pt(208, 136), puT);

        const baseWristN = pt(186, 174);
        const baseElbowN = lerpPt(pt(184, 140), pt(164, 152), puT);
        const wristN = lerpPt(baseWristN, pt(shoulder.x + 2, shoulder.y + 4), tapL);
        const elbowN = lerpPt(baseElbowN, pt(shoulder.x + 10, shoulder.y + 26), tapL);

        const baseWristF = pt(194, 174);
        const baseElbowF = lerpPt(pt(192, 140), pt(172, 152), puT);
        const wristF = lerpPt(baseWristF, pt(shoulder.x - 2, shoulder.y + 4), tapR);
        const elbowF = lerpPt(baseElbowF, pt(shoulder.x + 4, shoulder.y + 26), tapR);

        svg = floorMat(180) + drawSkeleton(
          { head, shoulder, hip, kneeN: knee, kneeF: pt(knee.x - 4, knee.y), ankleN: ankle, ankleF: pt(ankle.x - 4, ankle.y), footN: foot, elbowN, wristN, elbowF, wristF },
          { torsoGlow: tapL > 0.2 || tapR > 0.2, armNGlow: puT > 0.3, glows: [{ p: hip, r: 16, i: Math.max(tapL, tapR) }] }
        );
      }

      // 13. Calf Raises (Rise high + 1s top pause)
      else if (exId === 'd3_e3') {
        let t, ph;
        if (p < 0.35) { t = ease(p / 0.35); ph = 'RISE ONTO TOES'; }
        else if (p < 0.6) { t = 1; ph = 'PAUSE AT TOP (1s)'; }
        else { t = 1 - ease((p - 0.6) / 0.4); ph = 'LOWER HEELS SLOWLY'; }

        const lift = t * 18;
        const wall = `<rect x="192" y="24" width="12" height="156" rx="2" fill="#334155" stroke="#64748b" stroke-width="2"/>`;
        const footN = pt(148, 176);
        const ankleN = pt(132, 174 - lift);
        const kneeN = pt(134, 134 - lift);
        const hip = pt(134, 96 - lift);
        const shoulder = pt(136, 48 - lift);
        const head = pt(138, 29 - lift);
        const elbowN = pt(164, 62 - lift);
        const wristN = pt(192, 62 - lift * 0.5);

        svg = floorMat(180) + wall + drawSkeleton(
          { head, shoulder, hip, kneeN, kneeF: pt(kneeN.x - 8, kneeN.y), ankleN, ankleF: pt(ankleN.x - 8, ankleN.y), footN, footF: pt(footN.x - 8, footN.y), elbowN, wristN },
          { calfGlow: t > 0.25, glows: [{ p: lerpPt(kneeN, ankleN, 0.55), r: 16, i: t }] }
        );
        phase = ph;
      }

      // 14. Lying Leg Raises (Raise + slow 3s lower)
      else if (exId === 'd3_e4') {
        let t, ph;
        if (p < 0.32) { t = ease(p / 0.32); ph = 'RAISE LEGS UP'; }
        else { t = 1 - ease((p - 0.32) / 0.68); ph = 'LOWER SLOWLY (3s)'; }

        const head = pt(48, 162);
        const shoulder = pt(74, 168);
        const hip = pt(146, 170);
        const ang = lerp(-0.1, -Math.PI / 2, t);
        const kneeN = pt(hip.x + Math.cos(ang) * 44, hip.y + Math.sin(ang) * 44);
        const ankleN = pt(hip.x + Math.cos(ang) * 84, hip.y + Math.sin(ang) * 84);
        const elbowN = pt(106, 174), wristN = pt(140, 174);

        svg = floorMat(180) + drawSkeleton(
          { head, shoulder, hip, kneeN, kneeF: pt(kneeN.x + 4, kneeN.y + 3), ankleN, ankleF: pt(ankleN.x + 4, ankleN.y + 3), elbowN, wristN },
          { torsoGlow: true, glows: [{ p: lerpPt(shoulder, hip, 0.72), r: 18, i: 0.4 + 0.6 * (1 - t) }] }
        );
        phase = ph;
      }

      // 15. Slow Mountain Climbers (Alternating knee drives)
      else {
        const isFirst = p < 0.5;
        const sub = isFirst ? p * 2 : (p - 0.5) * 2;
        const t = sub < 0.5 ? ease(sub * 2) : 1 - ease((sub - 0.5) * 2);
        phase = isFirst ? 'DRIVE LEFT KNEE SLOWLY' : 'DRIVE RIGHT KNEE SLOWLY';

        const head = pt(56, 94);
        const shoulder = pt(78, 106);
        const hip = pt(148, 128);
        const elbowN = pt(78, 140), wristN = pt(78, 174);
        const elbowF = pt(84, 140), wristF = pt(84, 174);

        const tN = isFirst ? t : 0;
        const tF = isFirst ? 0 : t;

        const kneeN = lerpPt(pt(190, 152), pt(120, 146), tN);
        const ankleN = lerpPt(pt(230, 174), pt(144, 168), tN);
        const kneeF = lerpPt(pt(194, 152), pt(124, 146), tF);
        const ankleF = lerpPt(pt(234, 174), pt(148, 168), tF);

        svg = floorMat(180) + drawSkeleton(
          { head, shoulder, hip, kneeN, kneeF, ankleN, ankleF, elbowN, wristN, elbowF, wristF },
          { torsoGlow: true, glows: [{ p: lerpPt(shoulder, hip, 0.6), r: 18, i: 0.4 + 0.6 * t }] }
        );
      }

      return { svg, phase };
    }

    // --- Timer Engine ---
    function startTimer(sec, label = 'Timer', isHold = false) {
      clearInterval(timerInterval);
      timeLeft = sec;
      const lbl = document.getElementById('timerLabel');
      const clk = document.getElementById('timerClock');
      lbl.textContent = label;
      clk.classList.toggle('hold', isHold);
      updateClock();
      timerInterval = setInterval(() => {
        timeLeft--;
        updateClock();
        if (timeLeft <= 0) {
          clearInterval(timerInterval);
          lbl.textContent = 'DONE!';
          playBeep();
        }
      }, 1000);
    }

    function stopTimer() {
      clearInterval(timerInterval);
      timeLeft = 0;
      document.getElementById('timerLabel').textContent = 'STOPPED';
      updateClock();
    }

    function updateClock() {
      const m = String(Math.floor(timeLeft / 60)).padStart(2, '0');
      const s = String(timeLeft % 60).padStart(2, '0');
      document.getElementById('timerClock').textContent = `${m}:${s}`;
    }

    function playBeep() {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        osc.type = 'sine';
        osc.frequency.value = 880;
        osc.connect(ctx.destination);
        osc.start();
        setTimeout(() => osc.stop(), 320);
      } catch (e) {}
    }

    // --- Workout Interactions ---
    function updateSetValue(exId, idx, val) {
      const sets = getDraftSets(exId);
      sets[idx].val = val;
      saveState();
    }

    function toggleSetDone(dayIdx, exIdx, setIdx) {
      const ex = WORKOUTS[dayIdx].exercises[exIdx];
      const sets = getDraftSets(ex.id);
      sets[setIdx].done = !sets[setIdx].done;
      if (sets[setIdx].done) startTimer(60, `Rest • ${ex.name}`, false);
      saveState();
      render();
    }

    function addSet(exId) {
      getDraftSets(exId).push({ val: '', done: false });
      saveState();
      render();
    }

    function removeSet(exId) {
      const sets = getDraftSets(exId);
      if (sets.length > 1) {
        sets.pop();
        saveState();
        render();
      }
    }

    function completeWorkout(dayIdx) {
      const day = WORKOUTS[dayIdx];
      const loggedExercises = day.exercises.map(ex => {
        const sets = getDraftSets(ex.id);
        const vals = sets
          .filter(s => s.done || (s.val && Number(s.val) > 0))
          .map(s => Number(s.val) || (ex.unit === 'sec' ? 30 : 10));
        return { id: ex.id, name: ex.name, unit: ex.unit, sets: vals };
      }).filter(e => e.sets.length > 0);

      if (!loggedExercises.length) {
        showToast('Log at least 1 set first!');
        return;
      }

      const now = new Date();
      state.history.unshift({
        id: 'log_' + Date.now(),
        dayIdx,
        title: day.title,
        date: now.toLocaleDateString() + ' ' + now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
        ts: Date.now(),
        exercises: loggedExercises
      });

      // Reset drafts for this day
      day.exercises.forEach(ex => {
        state.drafts[ex.id] = [{ val: '', done: false }, { val: '', done: false }, { val: '', done: false }];
      });
      saveState();
      showToast('Workout logged!');
      render();
    }

    // --- Sample Data Generator for Charts ---
    function getSampleHistory() {
      const now = Date.now();
      const dayMs = 86400000;
      return [
        { id: 's1', dayIdx: 0, title: WORKOUTS[0].title, date: '3 wks ago', ts: now - 21 * dayMs, exercises: [{ id: 'd1_e1', name: 'Incline Push-Ups', unit: 'reps', sets: [8,8,8] }, { id: 'd1_e2', name: 'Bodyweight Squats', unit: 'reps', sets: [12,12,12] }, { id: 'd1_e3', name: 'Overhead Tricep Extensions', unit: 'reps', sets: [12,12,12] }, { id: 'd1_e5', name: 'Forearm Plank', unit: 'sec', sets: [30,30,30] }] },
        { id: 's2', dayIdx: 0, title: WORKOUTS[0].title, date: '2 wks ago', ts: now - 14 * dayMs, exercises: [{ id: 'd1_e1', name: 'Incline Push-Ups', unit: 'reps', sets: [10,9,9] }, { id: 'd1_e2', name: 'Bodyweight Squats', unit: 'reps', sets: [14,13,13] }, { id: 'd1_e3', name: 'Overhead Tricep Extensions', unit: 'reps', sets: [13,13,12] }, { id: 'd1_e5', name: 'Forearm Plank', unit: 'sec', sets: [35,35,30] }] },
        { id: 's3', dayIdx: 0, title: WORKOUTS[0].title, date: '1 wk ago', ts: now - 7 * dayMs, exercises: [{ id: 'd1_e1', name: 'Incline Push-Ups', unit: 'reps', sets: [11,10,10] }, { id: 'd1_e2', name: 'Bodyweight Squats', unit: 'reps', sets: [15,14,14] }, { id: 'd1_e3', name: 'Overhead Tricep Extensions', unit: 'reps', sets: [14,14,13] }, { id: 'd1_e5', name: 'Forearm Plank', unit: 'sec', sets: [40,40,35] }] },
        { id: 's4', dayIdx: 0, title: WORKOUTS[0].title, date: 'Recent', ts: now - 2 * dayMs, exercises: [{ id: 'd1_e1', name: 'Incline Push-Ups', unit: 'reps', sets: [12,12,11] }, { id: 'd1_e2', name: 'Bodyweight Squats', unit: 'reps', sets: [15,15,15] }, { id: 'd1_e3', name: 'Overhead Tricep Extensions', unit: 'reps', sets: [15,15,14] }, { id: 'd1_e5', name: 'Forearm Plank', unit: 'sec', sets: [45,45,40] }] }
      ];
    }

    // --- Render Views ---
    function render() {
      const app = document.getElementById('app');
      if (currentView === 'workouts') renderWorkouts(app);
      else if (currentView === 'charts') renderCharts(app);
      else if (currentView === 'history') renderHistory(app);
      else if (currentView === 'backup') renderBackup(app);
      else if (currentView === 'reminders') renderReminders(app);
    }

    function renderWorkouts(app) {
      const day = WORKOUTS[currentDay];
      const tabsHtml = `<div class="day-tabs">${WORKOUTS.map((w, i) => `<button class="day-tab ${i === currentDay ? 'active' : ''}" onclick="currentDay=${i};render();">${w.tab}</button>`).join('')}</div>`;
      const cardsHtml = day.exercises.map((ex, exIdx) => {
        const sets = getDraftSets(ex.id);
        const placeholder = ex.unit === 'sec' ? 'Seconds' : 'Reps';
        return `<div class="card">
          <div class="ex-top">
            <div class="ex-title">${ex.name}</div>
            <button class="guide-btn" onclick="openGuide(${currentDay}, ${exIdx})">▶ Form Guide</button>
          </div>
          <div class="ex-target">${ex.target}</div>
          <div class="ex-note">${ex.how}</div>
          <div class="timer-chips">
            ${ex.timers.map(t => `<button class="chip" onclick="startTimer(${t.sec}, '${ex.name}: ${t.label}', ${!t.isRest})">⏱ ${t.label}</button>`).join('')}
          </div>
          ${sets.map((s, sIdx) => `
            <div class="set-row">
              <div class="set-label">Set ${sIdx + 1}</div>
              <input class="set-input" type="number" inputmode="numeric" placeholder="${placeholder}" value="${s.val}" oninput="updateSetValue('${ex.id}', ${sIdx}, this.value)" />
              <button class="set-done ${s.done ? 'done' : ''}" onclick="toggleSetDone(${currentDay}, ${exIdx}, ${sIdx})">${s.done ? '✓ Done' : 'Mark'}</button>
            </div>
          `).join('')}
          <div class="set-controls">
            <button class="small-btn" onclick="addSet('${ex.id}')">+ Add Set</button>
            <button class="small-btn" onclick="removeSet('${ex.id}')">− Remove Set</button>
          </div>
        </div>`;
      }).join('');
      app.innerHTML = tabsHtml + cardsHtml + `<button class="primary-btn" onclick="completeWorkout(${currentDay})">Complete & Log ${day.tab}</button>`;
    }

    function renderCharts(app) {
      const source = useSampleData ? getSampleHistory() : [...state.history].reverse();
      const allEx = WORKOUTS.flatMap(w => w.exercises);
      const points = [];
      source.forEach(log => {
        if (chartExercise === 'all') {
          const totalSets = log.exercises.reduce((a, e) => a + e.sets.length, 0);
          const totalVol = log.exercises.reduce((a, e) => a + e.sets.reduce((x, y) => x + y, 0), 0);
          points.push({ date: log.date.split(' ')[0], val: chartMetric === 'sets' ? totalSets : totalVol, detail: `${log.title} • ${totalSets} sets, ${totalVol} total reps/sec` });
        } else {
          const found = log.exercises.find(e => e.id === chartExercise);
          if (found) {
            const vol = found.sets.reduce((a, b) => a + b, 0);
            const best = Math.max(...found.sets);
            const val = chartMetric === 'sets' ? found.sets.length : (chartMetric === 'best' ? best : vol);
            points.push({ date: log.date.split(' ')[0], val, detail: `${log.date} • Sets: ${found.sets.join(', ')} (${found.unit})` });
          }
        }
      });

      const bestVal = points.length ? Math.max(...points.map(p => p.val)) : 0;
      const avgVal = points.length ? Math.round(points.reduce((a, b) => a + b.val, 0) / points.length) : 0;
      const trend = points.length >= 2 && points[0].val > 0 ? Math.round(((points[points.length - 1].val - points[0].val) / points[0].val) * 100) : 0;

      let svgHtml = `<div style="text-align:center;padding:34px 10px;color:var(--muted);font-size:0.86rem;">Log at least 1 workout (or tap Preview Sample Data) to see your progress graph.</div>`;
      if (points.length) {
        const w = 320, h = 150, pad = 26;
        const maxV = Math.max(...points.map(p => p.val), 1);
        const coords = points.map((p, i) => {
          const x = points.length === 1 ? w / 2 : pad + (i / (points.length - 1)) * (w - pad * 2);
          const y = h - pad - (p.val / maxV) * (h - pad * 2);
          return { x, y, ...p };
        });
        const poly = coords.map(c => `${c.x},${c.y}`).join(' ');
        svgHtml = `<svg viewBox="0 0 ${w} ${h}" width="100%" height="165">
          <line x1="${pad}" y1="${h - pad}" x2="${w - pad}" y2="${h - pad}" stroke="#334155" stroke-width="1"/>
          ${coords.length > 1 ? `<polyline fill="none" stroke="#38bdf8" stroke-width="3" points="${poly}" />` : ''}
          ${coords.map((c, i) => `
            <circle cx="${c.x}" cy="${c.y}" r="${selectedPointIdx === i ? 7 : 5}" fill="${selectedPointIdx === i ? '#22c55e' : '#38bdf8'}" style="cursor:pointer;" onclick="selectedPointIdx=${i};render();"/>
            <text x="${c.x}" y="${c.y - 10}" fill="#f8fafc" font-size="10" text-anchor="middle">${c.val}</text>
            <text x="${c.x}" y="${h - 8}" fill="#94a3b8" font-size="9" text-anchor="middle">${c.date}</text>
          `).join('')}
        </svg>`;
      }

      const activeDetail = selectedPointIdx !== null && points[selectedPointIdx]
        ? `<div class="ex-note" style="margin-top:8px;"><strong>Selected:</strong> ${points[selectedPointIdx].detail}</div>` : '';

      app.innerHTML = `
        <div class="section-title">Progress Charts</div>
        <select onchange="chartExercise=this.value;selectedPointIdx=null;render();">
          <option value="all" ${chartExercise === 'all' ? 'selected' : ''}>All Workouts (Overall)</option>
          ${allEx.map(e => `<option value="${e.id}" ${chartExercise === e.id ? 'selected' : ''}>${e.name}</option>`).join('')}
        </select>
        <div class="pill-row">
          <button class="pill ${chartMetric === 'volume' ? 'active' : ''}" onclick="chartMetric='volume';render();">Total Reps / Sec</button>
          <button class="pill ${chartMetric === 'sets' ? 'active' : ''}" onclick="chartMetric='sets';render();">Sets Completed</button>
          ${chartExercise !== 'all' ? `<button class="pill ${chartMetric === 'best' ? 'active' : ''}" onclick="chartMetric='best';render();">Best Single Set</button>` : ''}
        </div>
        <div class="stat-grid">
          <div class="stat-box"><div class="stat-val">${bestVal}</div><div class="stat-lbl">Best</div></div>
          <div class="stat-box"><div class="stat-val">${avgVal}</div><div class="stat-lbl">Average</div></div>
          <div class="stat-box"><div class="stat-val">${trend >= 0 ? '+' : ''}${trend}%</div><div class="stat-lbl">Trend</div></div>
        </div>
        <div class="chart-box">${svgHtml}${activeDetail}</div>
        <button class="btn-outline" style="width:100%;" onclick="useSampleData=!useSampleData;selectedPointIdx=null;render();">
          ${useSampleData ? 'Hide Sample Data' : '✨ Preview Sample Data'}
        </button>
      `;
    }

    function renderHistory(app) {
      if (!state.history.length) {
        app.innerHTML = `<div class="section-title">Workout History</div><div class="card"><p style="color:var(--muted);font-size:0.88rem;">No logged workouts yet. Complete a session on the Workouts tab to record it here.</p></div>`;
        return;
      }
      app.innerHTML = `<div class="section-title">Workout History (${state.history.length})</div>` +
        state.history.map((h, i) => `
          <div class="hist-card">
            <div class="hist-head" onclick="document.getElementById('hd_${i}').classList.toggle('open')">
              <div>
                <strong style="font-size:0.92rem;">${h.title}</strong>
                <div style="font-size:0.76rem;color:var(--muted);">${h.date} • ${h.exercises.length} exercises</div>
              </div>
              <span style="color:var(--accent);font-size:0.8rem;">Details ▾</span>
            </div>
            <div id="hd_${i}" class="hist-detail">
              ${h.exercises.map(e => `<div style="margin-bottom:5px;"><strong style="color:var(--text);">${e.name}:</strong> ${e.sets.join(' / ')} ${e.unit}</div>`).join('')}
            </div>
          </div>
        `).join('');
    }

    function renderBackup(app) {
      app.innerHTML = `
        <div class="section-title">Import / Export Backup</div>
        <div class="card">
          <div style="font-size:0.85rem;color:var(--muted);margin-bottom:10px;">
            Logged Sessions: <strong style="color:var(--text);">${state.history.length}</strong><br/>
            Last Backup: <strong style="color:var(--text);">${state.lastBackup || 'Never'}</strong>
          </div>
          <div class="row-btns">
            <button class="btn-accent" onclick="downloadBackup()">📥 Download Backup (.json)</button>
            <button class="btn-outline" onclick="copyBackup()">📋 Copy Backup Code</button>
          </div>
        </div>
        <div class="card">
          <strong style="display:block;margin-bottom:8px;font-size:0.92rem;">Restore Backup</strong>
          <input type="file" accept=".json,application/json" onchange="importFile(event)" style="margin-bottom:10px;font-size:0.82rem;" />
          <textarea id="importBox" rows="4" placeholder="Or paste your backup JSON code here..."></textarea>
          <div class="row-btns">
            <button class="btn-accent" onclick="importFromText(true)">🔀 Merge with Existing</button>
            <button class="btn-danger" onclick="importFromText(false)">♻️ Replace All</button>
          </div>
        </div>
      `;
    }

    function downloadBackup() {
      state.lastBackup = new Date().toLocaleString();
      saveState();
      const blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = `recomp-backup-${new Date().toISOString().slice(0, 10)}.json`;
      a.click();
      showToast('Backup downloaded!');
      render();
    }

    function copyBackup() {
      state.lastBackup = new Date().toLocaleString();
      saveState();
      copyText(JSON.stringify(state), 'Backup JSON copied!');
      render();
    }

    function copyText(text, msg) {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(() => showToast(msg)).catch(() => fallbackCopy(text, msg));
      } else fallbackCopy(text, msg);
    }
    function fallbackCopy(text, msg) {
      const ta = document.createElement('textarea');
      ta.value = text;
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      ta.remove();
      showToast(msg);
    }

    function importFile(e) {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => { document.getElementById('importBox').value = reader.result; showToast('File loaded—choose Merge or Replace'); };
      reader.readAsText(file);
    }

    function importFromText(merge) {
      try {
        const parsed = JSON.parse(document.getElementById('importBox').value.trim());
        if (!Array.isArray(parsed.history)) throw new Error('Invalid format');
        if (merge) {
          const existingIds = new Set(state.history.map(h => h.id));
          parsed.history.forEach(h => { if (!existingIds.has(h.id)) state.history.push(h); });
          state.history.sort((a, b) => b.ts - a.ts);
        } else {
          state = Object.assign(defaultState(), parsed);
        }
        saveState();
        showToast(merge ? 'History merged!' : 'Backup restored!');
        render();
      } catch (e) {
        showToast('Invalid JSON backup code');
      }
    }

    // --- Reminders, OneSignal Cloud Push Sync & ICS Export ---
    const DAY_NAMES = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
    const ICS_DAYS = ['SU', 'MO', 'TU', 'WE', 'TH', 'FR', 'SA'];

    function getPushSlot(timeStr) {
      const parts = (timeStr || '10:00').split(':');
      const hh = String(parts[0] || '10').padStart(2, '0');
      const mm = Number(parts[1] || 0) < 30 ? '00' : '30';
      return `${hh}:${mm}`;
    }

    function syncOneSignalSchedule(notifyUser = false) {
      if (!window.OneSignalDeferred) return;
      const slot = getPushSlot(state.notif.time);
      const selectedDays = state.notif.days.slice(0, 5); // OneSignal Free plan supports up to 6 tags (1 slot + up to 5 days)
      const tagsToAdd = {
        remind_slot: state.notif.enabled ? slot : 'OFF'
      };
      const tagsToRemove = [];
      for (let d = 0; d < 7; d++) {
        if (selectedDays.includes(d)) tagsToAdd['d' + d] = '1';
        else tagsToRemove.push('d' + d);
      }

      window.OneSignalDeferred.push(async function(OneSignal) {
        try {
          if (!OneSignal.User.PushSubscription.optedIn) return;
          if (tagsToRemove.length) await OneSignal.User.removeTags(tagsToRemove);
          await OneSignal.User.addTags(tagsToAdd);
          if (notifyUser) showToast(`Push schedule synced (${state.notif.enabled ? slot : 'Paused'})`);
        } catch (e) {}
      });
    }

    function enableOneSignalPush() {
      if (!window.OneSignalDeferred) {
        showToast('Push SDK still loading...');
        return;
      }
      window.OneSignalDeferred.push(async function(OneSignal) {
        try {
          await OneSignal.Notifications.requestPermission();
          await OneSignal.User.PushSubscription.optIn();
          window.oneSignalOptedIn = Boolean(OneSignal.User.PushSubscription.optedIn);
          if (window.oneSignalOptedIn) {
            syncOneSignalSchedule(false);
            showToast('Push notifications enabled & synced!');
          } else {
            showToast('Please allow notifications in browser settings');
          }
          render();
        } catch (e) {
          showToast('Could not enable push notifications');
        }
      });
    }

    function toggleNotifEnabled() {
      state.notif.enabled = !state.notif.enabled;
      saveState();
      syncOneSignalSchedule(true);
      render();
    }

    function updateNotifTime(val) {
      state.notif.time = val || '10:00';
      saveState();
      syncOneSignalSchedule(true);
      render();
    }

    function renderReminders(app) {
      const slot = getPushSlot(state.notif.time);
      const daysLabel = state.notif.days.length
        ? state.notif.days.map(d => DAY_NAMES[d]).join(', ')
        : 'None';
      const pushStatusHtml = window.oneSignalOptedIn
        ? `<span style="color:var(--success);font-weight:800;">Subscribed ✓</span>`
        : `<button class="btn-accent" onclick="enableOneSignalPush()">Enable Push</button>`;

      app.innerHTML = `
        <div class="section-title">Workout Reminders</div>
        <div class="card">
          <div style="display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:8px;">
            <div>
              <strong>Background Push (OneSignal)</strong>
              <div style="font-size:0.76rem;color:var(--muted);">Sends alerts even when the app is closed</div>
            </div>
            ${pushStatusHtml}
          </div>
          <div class="ex-note" style="margin-bottom:0;">
            ${window.oneSignalOptedIn
              ? `Synced schedule: <strong style="color:var(--text);">${state.notif.enabled ? `${daysLabel} at ${slot} ET` : 'Paused'}</strong> (checks at :00 &amp; :30)`
              : 'Tap <strong>Enable Push</strong> once to subscribe this device and sync your schedule below.'}
          </div>
        </div>
        <div class="card">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;">
            <strong>Reminders Status</strong>
            <button class="${state.notif.enabled ? 'btn-accent' : 'btn-outline'}" onclick="toggleNotifEnabled()">
              ${state.notif.enabled ? 'Enabled ✓' : 'Paused'}
            </button>
          </div>
          <label style="font-size:0.8rem;color:var(--muted);display:block;margin-bottom:6px;">Workout Days (up to 5 days for free cloud push)</label>
          <div class="day-chip-grid">
            ${DAY_NAMES.map((d, i) => `<button class="day-chip ${state.notif.days.includes(i) ? 'active' : ''}" onclick="toggleNotifDay(${i})">${d}</button>`).join('')}
          </div>
          <label style="font-size:0.8rem;color:var(--muted);display:block;margin-bottom:6px;">Reminder Time (Eastern Time — snaps to :00 or :30 for cloud push)</label>
          <input type="time" value="${state.notif.time}" onchange="updateNotifTime(this.value)" />
          <div class="row-btns">
            <button class="btn-accent" onclick="testNotification()">🔔 Test Local Alert</button>
            <button class="btn-outline" onclick="exportICS()">📥 Export Calendar Alarm (.ics)</button>
          </div>
        </div>
      `;
    }

    function toggleNotifDay(dayIdx) {
      const i = state.notif.days.indexOf(dayIdx);
      if (i >= 0) {
        state.notif.days.splice(i, 1);
      } else {
        if (state.notif.days.length >= 5) {
          showToast('Max 5 days for free cloud push');
          return;
        }
        state.notif.days.push(dayIdx);
      }
      state.notif.days.sort();
      saveState();
      syncOneSignalSchedule(true);
      render();
    }

    function testNotification() {
      playBeep();
      showToast('Time for Your 3-Day Recomp Workout!');
      if ('Notification' in window) {
        Notification.requestPermission().then(perm => {
          if (perm === 'granted') {
            new Notification('3-Day Recomp Tracker', {
              body: 'Time for your bodyweight workout session!',
              icon: './icon-192.png'
            });
          }
        });
      }
    }

    function exportICS() {
      const [hh, mm] = state.notif.time.split(':');
      const byday = state.notif.days.map(d => ICS_DAYS[d]).join(',') || 'MO,WE,FR';
      const now = new Date();
      const y = now.getFullYear(), m = String(now.getMonth() + 1).padStart(2, '0'), d = String(now.getDate()).padStart(2, '0');
      const ics = [
        'BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//RecompTracker//EN',
        'BEGIN:VEVENT', `DTSTART:${y}${m}${d}T${hh}${mm}00`, 'DURATION:PT45M',
        `RRULE:FREQ=WEEKLY;BYDAY=${byday}`,
        'SUMMARY:3-Day Body Recomp Workout',
        'DESCRIPTION:Open your Recomp Tracker PWA for today\'s bodyweight routine.',
        'BEGIN:VALARM', 'TRIGGER:-PT0M', 'ACTION:DISPLAY', 'DESCRIPTION:Workout Time!', 'END:VALARM',
        'END:VEVENT', 'END:VCALENDAR'
      ].join('\r\n');
      const a = document.createElement('a');
      a.href = URL.createObjectURL(new Blob([ics], { type: 'text/calendar' }));
      a.download = 'recomp-workout-reminders.ics';
      a.click();
      showToast('Calendar alarm (.ics) exported!');
    }

    setInterval(() => {
      if (!state.notif.enabled) return;
      const now = new Date();
      const hhmm = String(now.getHours()).padStart(2, '0') + ':' + String(now.getMinutes()).padStart(2, '0');
      const key = `${now.toDateString()}-${hhmm}`;
      if (state.notif.days.includes(now.getDay()) && hhmm === state.notif.time && lastNotifFiredKey !== key) {
        lastNotifFiredKey = key;
        testNotification();
      }
    }, 20000);

    updateWeeklyBadge();
    render();
  </script>
</body>
</html>
