name: OneSignal Workout Push

on:
  repository_dispatch:
    types: [workout_push_tick]
  workflow_dispatch:

jobs:
  send-push:
    runs-on: ubuntu-latest
    steps:
      - name: Send OneSignal Web Push
        env:
          ONESIGNAL_APP_ID: ${{ secrets.ONESIGNAL_APP_ID }}
          ONESIGNAL_API_KEY: ${{ secrets.ONESIGNAL_API_KEY }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Manual test run: sending to all subscribed users"
            curl -sS -X POST "https://api.onesignal.com/notifications?c=push" \
              -H "Content-Type: application/json" \
              -H "Authorization: Key $ONESIGNAL_API_KEY" \
              -d "{
                \"app_id\": \"$ONESIGNAL_APP_ID\",
                \"included_segments\": [\"Subscribed Users\"],
                \"headings\": {\"en\": \"3-Day Recomp Tracker (Test)\"},
                \"contents\": {\"en\": \"Push notifications are working! Tap to open your tracker.\"},
                \"url\": \"https://annyeonghaters.github.io/Recomp-Exercise-Tracker/\"
              }"
          else
            SLOT=$(TZ="America/New_York" date -d "-3 minutes" +"%H:%M" | awk -F: '{m=($2<30)?"00":"30"; printf "%s:%s", $1, m}')
            DOW=$(TZ="America/New_York" date -d "-3 minutes" +"%w")
            echo "Scheduled check: slot=$SLOT dow=$DOW"
            curl -sS -X POST "https://api.onesignal.com/notifications?c=push" \
              -H "Content-Type: application/json" \
              -H "Authorization: Key $ONESIGNAL_API_KEY" \
              -d "{
                \"app_id\": \"$ONESIGNAL_APP_ID\",
                \"filters\": [
                  {\"field\": \"tag\", \"key\": \"remind_slot\", \"relation\": \"=\", \"value\": \"$SLOT\"},
                  {\"operator\": \"AND\"},
                  {\"field\": \"tag\", \"key\": \"d$DOW\", \"relation\": \"=\", \"value\": \"1\"}
                ],
                \"headings\": {\"en\": \"Time for Your 3-Day Recomp Workout!\"},
                \"contents\": {\"en\": \"Open your Recomp Tracker to log today's sets and rest timers.\"},
                \"url\": \"https://annyeonghaters.github.io/Recomp-Exercise-Tracker/\"
              }"
          fi
          
